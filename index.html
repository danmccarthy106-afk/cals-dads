<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cal's Dads</title>
<meta name="description" content="Events and RSVPs for Cal's Dads — the dads of Cal's Angels.">
<meta name="theme-color" content="#131a2a">
<meta property="og:title" content="Cal's Dads">
<meta property="og:description" content="Good Dads. Good Times. Great Cause.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --bg: #f6f3ec; --card: #ffffff; --ink: #1c2332; --muted: #5b6475; --line: #e3ddd0; --field: #fbfaf7;
  --navy: #131a2a; --navy-ink: #f7f4ec; --gold: #8a6300; --gold-bright: #f5c11e; --gold-soft: #fbf0cc;
  --green: #2c7a57; --green-soft: #e1f1e8; --amber: #9a6200; --amber-soft: #fbeed6;
  --red: #a23a3a; --red-soft: #f7e2e2; --sky: #33689f; --sky-soft: #e2ecf7;
  --shadow: 0 1px 2px rgba(20, 25, 40, .05), 0 6px 18px rgba(20, 25, 40, .06);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11141b; --card: #1a1f2a; --ink: #eceff5; --muted: #a2aabb; --line: #2b3242; --field: #151923;
    --navy: #0b0f19; --navy-ink: #f7f4ec; --gold: #f5c11e; --gold-bright: #f5c11e; --gold-soft: #332a12;
    --green: #64c49a; --green-soft: #183328; --amber: #e8a94f; --amber-soft: #3a2d18;
    --red: #e88383; --red-soft: #3b2020; --sky: #86b5ea; --sky-soft: #1b2a3d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
h1, h2, h3 { line-height: 1.2; margin: 0; }
h1, h2 { font-family: "Permanent Marker", "Inter", sans-serif; font-weight: 400; letter-spacing: .01em; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.12rem; font-weight: 800; letter-spacing: -.01em; }
.banner { margin: 0 0 22px; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); background: var(--navy); }
.banner img { display: block; width: 100%; height: auto; aspect-ratio: 2048 / 768; object-fit: cover; }
@media (max-width: 600px) { .banner { margin-left: -16px; margin-right: -16px; border-radius: 0; } .banner img { aspect-ratio: auto; height: 200px; } }
.tagline { font-family: "Caveat Brush", cursive; font-size: 1.35rem; color: var(--gold); }
a { color: var(--sky); }
button, input, select, textarea { font: inherit; color: inherit; }
.ic svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.14em; }
.wrap { max-width: 900px; margin: 0 auto; padding: 0 16px; }

/* header */
.top { background: var(--navy); color: var(--navy-ink); position: sticky; top: 0; z-index: 20; }
.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; margin-right: auto; }
.brand svg { width: 22px; height: 30px; color: var(--gold-bright); flex: none; }
.brand b { font-family: "Permanent Marker", "Inter", sans-serif; font-size: 1.45rem; font-weight: 400; display: block; line-height: 1.05; letter-spacing: .02em; }
.brand b em { font-style: normal; color: var(--gold-bright); }
.brand small { display: block; font-size: .72rem; opacity: .7; letter-spacing: .04em; }
.who { font-size: .82rem; opacity: .85; display: flex; align-items: center; gap: 8px; }
.who button { background: transparent; border: 1px solid rgba(255,255,255,.3); color: inherit; border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: .8rem; }
.who .em { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav.tabs { display: flex; gap: 4px; width: 100%; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { color: var(--navy-ink); text-decoration: none; padding: 7px 14px; border-radius: 999px; font-size: .92rem; font-weight: 500; white-space: nowrap; opacity: .78; }
nav.tabs a.on { background: rgba(255,255,255,.14); opacity: 1; }
nav.tabs .count { background: var(--gold-bright); color: #231a00; border-radius: 999px; padding: 0 7px; font-size: .75rem; font-weight: 700; margin-left: 4px; }
.demo-bar { background: var(--gold-soft); color: var(--ink); font-size: .85rem; text-align: center; padding: 6px 16px; border-bottom: 1px solid var(--line); }

main { padding: 22px 0 60px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.pad { padding: 18px; }
.stack > * + * { margin-top: 14px; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 14px; flex-wrap: wrap; }
.section-head p { margin: 2px 0 0; }
.empty { text-align: center; padding: 34px 18px; color: var(--muted); }
.center { text-align: center; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 15px; cursor: pointer; font-weight: 600; font-size: .92rem; text-decoration: none; color: var(--ink); line-height: 1.2; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--navy); border-color: var(--navy); color: var(--navy-ink); }
@media (prefers-color-scheme: dark) { .btn.primary { background: var(--gold-bright); border-color: var(--gold-bright); color: #1c1400; } }
.btn.gold { background: var(--gold-bright); border-color: var(--gold-bright); color: #231a00; }
.btn.danger { color: var(--red); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 6px 11px; font-size: .84rem; border-radius: 8px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .55; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.link { background: none; border: 0; padding: 0; color: var(--sky); cursor: pointer; text-decoration: underline; font-size: inherit; }

/* forms */
label.f { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); }
label.f > span { display: block; margin-bottom: 5px; }
input[type=text], input[type=email], input[type=tel], input[type=password], input[type=date], input[type=time], input[type=search], select, textarea {
  width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 1rem; color: var(--ink); font-weight: 400;
}
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold-bright); outline-offset: 0; border-color: transparent; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--navy); flex: none; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg label, .seg button { border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: .9rem; font-weight: 600; background: var(--card); display: inline-flex; align-items: center; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg .on, .seg label:has(input:checked) { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.seg .on.yes { background: var(--green); border-color: var(--green); color: #fff; }
.seg .on.maybe { background: var(--amber); border-color: var(--amber); color: #fff; }
.seg .on.no { background: var(--red); border-color: var(--red); color: #fff; }
@media (prefers-color-scheme: dark) { .seg .on.yes, .seg .on.maybe, .seg .on.no { color: #10141c; } .seg label:has(input:checked) { background: var(--gold); color: #1c1400; border-color: var(--gold); } }
.err { color: var(--red); font-size: .88rem; }

/* sign in */
.hero { text-align: center; padding: 0 8px 22px; }
.hero p { max-width: 560px; margin: 6px auto 0; color: var(--muted); font-size: 1.04rem; }
.auth { max-width: 420px; margin: 0 auto; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .82rem; margin: 16px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.gbtn svg { width: 18px; height: 18px; }

/* events */
.event { display: grid; grid-template-columns: 74px 1fr; gap: 16px; padding: 18px; scroll-margin-top: 130px; }
.event.flash { animation: flash 2.2s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px var(--gold-bright); } 100% { box-shadow: var(--shadow); } }
.datebox { background: var(--gold-soft); border-radius: 12px; text-align: center; padding: 8px 4px; height: fit-content; }
.datebox span { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
.datebox b { display: block; font-weight: 800; font-size: 1.9rem; line-height: 1.05; }
.event h3 { font-size: 1.28rem; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: .92rem; margin-top: 6px; }
.details { margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--sky-soft); color: var(--sky); }
.tag.due { background: var(--amber-soft); color: var(--amber); }
.tag.closed { background: var(--red-soft); color: var(--red); }
.whos { margin-top: 12px; font-size: .9rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.chip { font-size: .8rem; padding: 3px 10px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-weight: 600; }
.chip.maybe { background: var(--amber-soft); color: var(--amber); }
.myrsvp { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.myrsvp .q { font-weight: 600; margin-bottom: 8px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.stepper button { border: 0; background: transparent; width: 34px; height: 32px; cursor: pointer; font-size: 1.1rem; }
.stepper b { min-width: 26px; text-align: center; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
@media (max-width: 520px) { .event { grid-template-columns: 1fr; gap: 10px; } .datebox { display: flex; align-items: baseline; gap: 8px; padding: 6px 12px; width: fit-content; } .datebox b { font-size: 1.2rem; } }
details.past > summary { cursor: pointer; font-weight: 600; color: var(--muted); padding: 8px 0; }
.pastrow { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }

/* dads */
.dads { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.dad header { display: flex; gap: 12px; align-items: center; padding: 16px 16px 0; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--navy); color: var(--navy-ink); display: grid; place-items: center; font-weight: 700; flex: none; }
.contact { font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
.contact a { color: inherit; }
.kid { padding: 14px 16px 16px; }
.kid + .kid { border-top: 1px solid var(--line); }
.kid .nm { font-weight: 700; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.kid .dx { color: var(--muted); font-size: .9rem; }
.status { display: inline-flex; align-items: center; gap: 4px; font-size: .75rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.st-treatment { background: var(--sky-soft); color: var(--sky); }
.st-remission { background: var(--green-soft); color: var(--green); }
.st-wings { background: var(--gold-soft); color: var(--gold); }
.thumbs { display: flex; gap: 10px; margin-top: 10px; }
.thumb { text-align: center; font-size: .72rem; color: var(--muted); }
.thumb img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; display: block; background: var(--field); border: 1px solid var(--line); cursor: zoom-in; margin-bottom: 3px; }
.search { max-width: 320px; }

/* profile */
.kidform { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: var(--field); }
.kidform .hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.slot { font-size: .85rem; font-weight: 600; color: var(--muted); }
.slot .box { margin-top: 5px; aspect-ratio: 1; border: 2px dashed var(--line); border-radius: 12px; display: grid; place-items: center; overflow: hidden; position: relative; cursor: pointer; background: var(--card); color: var(--muted); font-weight: 500; text-align: center; padding: 8px; max-width: 220px; }
.slot .box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slot .box.has { border-style: solid; padding: 0; }
.slot input[type=file] { display: none; }
.slot .rm { margin-top: 5px; }
.notice { border-radius: 12px; padding: 12px 14px; font-size: .92rem; background: var(--sky-soft); }
.notice.gold { background: var(--gold-soft); }

/* organizer */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
.stat { border-radius: 10px; padding: 8px 10px; background: var(--field); border: 1px solid var(--line); }
.stat b { display: block; font-size: 1.4rem; font-weight: 800; line-height: 1.1; }
.stat span { font-size: .76rem; color: var(--muted); font-weight: 600; }
.stat.yes b { color: var(--green); } .stat.maybe b { color: var(--amber); } .stat.no b { color: var(--red); }
@media (max-width: 520px) { .stats { grid-template-columns: 1fr 1fr; } }
.roster { width: 100%; border-collapse: collapse; font-size: .88rem; }
.roster th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 8px 6px; border-bottom: 1px solid var(--line); }
.roster td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
.roster td.nm { font-weight: 600; }
.roster select { padding: 4px 6px; font-size: .84rem; width: auto; }
.tablewrap { overflow-x: auto; }
@media (max-width: 640px) {
  .roster thead { display: none; }
  .roster tr { display: block; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .roster td { display: block; border: 0; padding: 2px 4px; }
}
.group-h { font-weight: 700; margin: 16px 0 2px; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.pending { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pending:last-child { border-bottom: 0; }

/* modal & toast */
.modal { position: fixed; inset: 0; background: rgba(10, 14, 24, .55); z-index: 50; display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.modal .card { width: 100%; max-width: 560px; max-height: calc(100vh - 32px); overflow-y: auto; }
.modal.photo .card { max-width: 720px; text-align: center; }
.modal.photo img { max-width: 100%; max-height: 70vh; border-radius: 10px; display: block; margin: 0 auto 10px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: .92rem; z-index: 60; box-shadow: var(--shadow); max-width: calc(100vw - 32px); text-align: center; }
.toast.bad { background: var(--red); color: #fff; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; margin: 60px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

/* ---------------------------------------------------------------- backends */
// Both backends expose the same small document API: paths look like "members/<uid>".

function firebaseBackend(cfg) {
  firebase.initializeApp(cfg);
  const auth = firebase.auth(), fs = firebase.firestore();
  const snap = d => (d.exists ? { id: d.id, ...d.data() } : null);
  const ref = p => fs.doc(p);
  const toUser = u => u && { uid: u.uid, email: (u.email || '').toLowerCase(), name: u.displayName || '', verified: u.emailVerified };
  return {
    onAuth: cb => auth.onAuthStateChanged(u => cb(toUser(u))),
    google: () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()),
    signIn: (e, p) => auth.signInWithEmailAndPassword(e, p),
    signUp: async (e, p) => { const c = await auth.createUserWithEmailAndPassword(e, p); c.user.sendEmailVerification().catch(() => {}); },
    reset: e => auth.sendPasswordResetEmail(e),
    resendVerify: () => auth.currentUser.sendEmailVerification(),
    refreshUser: async () => { const u = auth.currentUser; await u.reload(); await u.getIdToken(true); return toUser(auth.currentUser); },
    signOut: () => auth.signOut(),
    // meta/admin is readable only by organizers (see firestore.rules), so the read doubles as the check
    isAdmin: () => ref('meta/admin').get().then(() => true, () => false),
    watchDoc: (p, cb, err) => ref(p).onSnapshot(d => cb(snap(d)), err),
    watchCol: (name, filter, cb, err) => {
      let q = fs.collection(name);
      if (filter) q = q.where(filter[0], '==', filter[1]);
      return q.onSnapshot(s => cb(s.docs.map(snap)), err);
    },
    get: p => ref(p).get().then(snap),
    set: (p, data) => ref(p).set(data),
    del: p => ref(p).delete(),
    batch: async ops => {
      for (let i = 0; i < ops.length; i += 20) {
        const b = fs.batch();
        ops.slice(i, i + 20).forEach(o => (o.data ? b.set(ref(o.path), o.data) : b.delete(ref(o.path))));
        await b.commit();
      }
    },
  };
}

function demoBackend() {
  const KEY = 'calsdads-demo-v1';
  const USERS = {
    tom: { uid: 'tom', email: 'tom@example.com', name: 'Tom', verified: true, admin: true },
    mike: { uid: 'mike', email: 'mike@example.com', name: 'Mike', verified: true },
    newdad: { uid: 'newdad', email: 'new.dad@example.com', name: 'Chris Walker', verified: true },
  };
  let data, user = null, authCb = () => {};
  const listeners = new Set();
  try { data = JSON.parse(localStorage.getItem(KEY)); } catch (e) { /* private mode */ }
  if (!data) data = seedDemo();
  try { user = USERS[sessionStorage.getItem(KEY + '-user')] || null; } catch (e) { /* ignore */ }
  const col = n => data[n] || (data[n] = {});
  const read = p => { const [c, id] = p.split('/'); const d = col(c)[id]; return d ? { id, ...JSON.parse(JSON.stringify(d)) } : null; };
  const write = (p, d) => { const [c, id] = p.split('/'); if (d) col(c)[id] = JSON.parse(JSON.stringify(d)); else delete col(c)[id]; };
  const commit = () => {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { toast('Demo storage is full — photos in demo mode are kept until you reload.', true); }
    setTimeout(() => listeners.forEach(f => f()));
  };
  const listen = f => { listeners.add(f); f(); return () => listeners.delete(f); };
  return {
    demo: true,
    users: USERS,
    onAuth: cb => { authCb = cb; setTimeout(() => cb(user)); },
    demoSignIn: k => { user = USERS[k]; try { sessionStorage.setItem(KEY + '-user', k); } catch (e) { /* ignore */ } authCb(user); },
    signOut: async () => { user = null; try { sessionStorage.removeItem(KEY + '-user'); } catch (e) { /* ignore */ } authCb(null); },
    resetDemo: () => { try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } location.reload(); },
    isAdmin: async () => !!(user && user.admin),
    watchDoc: (p, cb) => listen(() => cb(read(p))),
    watchCol: (name, filter, cb) => listen(() => cb(Object.keys(col(name)).map(id => read(name + '/' + id)).filter(d => !filter || d[filter[0]] === filter[1]))),
    get: async p => read(p),
    set: async (p, d) => { write(p, d); commit(); },
    del: async p => { write(p, null); commit(); },
    batch: async ops => { ops.forEach(o => write(o.path, o.data || null)); commit(); },
  };
}

/* ---------------------------------------------------------------- photos */
// Photos are resized in the browser and stored as JPEG data in Firestore (photos/<uid>_<kid>_<kind>),
// so no paid storage bucket is needed. Loaded photos are cached as object URLs.
const PH = new Map();
const photoId = (owner, kidId, kind) => owner + '_' + kidId + '_' + kind;
function photoImg(owner, kid, kind, alt) {
  const v = kid.photos && kid.photos[kind];
  if (!v) return '';
  const key = photoId(owner, kid.id, kind) + '@' + v;
  const src = PH.get(key);
  return `<img data-ph="${esc(key)}" ${src ? `src="${src}"` : ''} alt="${esc(alt)}" data-a="zoom" data-cap="${esc(alt)}">`;
}
function hydratePhotos() {
  document.querySelectorAll('img[data-ph]:not([src])').forEach(img => loadPhoto(img.dataset.ph));
}
async function loadPhoto(key) {
  if (PH.has(key)) return;
  PH.set(key, '');
  let url = '';
  try {
    const d = await be.get('photos/' + key.split('@')[0]);
    if (d && d.data) url = URL.createObjectURL(await (await fetch(d.data)).blob());
  } catch (e) { /* not visible to this user, or gone */ }
  PH.set(key, url);
  document.querySelectorAll(`img[data-ph="${CSS.escape(key)}"]`).forEach(img => { if (url) img.src = url; else img.closest('.thumb')?.remove(); });
}
async function compressImage(file) {
  const src = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('That photo couldn’t be read. Try a JPG or PNG.')); i.src = src; });
    let max = 1000, q = 0.82, out = '';
    for (let n = 0; n < 10; n++) {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      out = c.toDataURL('image/jpeg', q);
      if (out.length <= 280000) return out;
      if (q > 0.6) q -= 0.1; else max = Math.round(max * 0.8);
    }
    return out;
  } finally { URL.revokeObjectURL(src); }
}

const S = {

  tab: 'events', focusEvent: null, search: '', form: null, openRoster: {}, authMode: 'signin',

let userSubs = [], dataSubs = [], dataOn = false, sharedContacts = [];

async function startUser(user) {
  unsubAll(userSubs); unsubAll(dataSubs); dataOn = false; sharedContacts = [];
  Object.assign(S, { user, admin: false, me: undefined, myContact: null, members: [], contacts: {}, events: [], rsvps: [], invites: [], form: null, error: '' });
  render(true);
  if (!user) return;
  S.admin = await be.isAdmin();
  userSubs.push(be.watchDoc('contacts/' + user.uid, c => { S.myContact = c; mergeContacts(); render(); }, loadErr));
  userSubs.push(be.watchDoc('members/' + user.uid, m => {
    S.me = m;
    if (canSee() && !dataOn) startData();

  }, loadErr));
}

function startData() {
  dataOn = true;
  const set = k => list => { S[k] = list; render(); };

  dataSubs.push(be.watchCol('contacts', S.admin ? null : ['share', true], list => { sharedContacts = list; mergeContacts(); render(); }, loadErr));
  dataSubs.push(be.watchCol('events', null, list => { S.events = list.sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start)); render(); focusEventIfNeeded(); openDraftIfNeeded(); }, loadErr));
  dataSubs.push(be.watchCol('rsvps', null, set('rsvps'), loadErr));
  if (S.admin) dataSubs.push(be.watchCol('invites', null, list => { S.invites = list.sort((a, b) => (a.name || '~').localeCompare(b.name || '~')); render(); }, loadErr));
}

function eventRsvps(evId) {

  return S.rsvps.filter(r => r.eventId === evId && (known.has(r.uid) || isRosterUid(r.uid)));
}
const isRosterUid = uid => /^p\d+$/.test(uid);
const rsvpName = r => (memberById(r.uid) ? fullName(memberById(r.uid)) : r.name || 'A dad');
function tally(list) {
  const t = { yes: 0, maybe: 0, no: 0, guests: 0 };
  list.forEach(r => { t[r.status]++; if (r.status === 'yes') t.guests += r.guests || 0; });
  return t;
}
const memberById = id => S.members.find(m => m.id === id);

function eventsView() {

function whenText(e) { return fmtDate(e.date) + (e.start ? ' at ' + fmtTime(e.start) : ''); }

}
async function setRsvp(evId, patch, uid) {
  uid = uid || S.user.uid;
  const id = evId + '_' + uid;
  const cur = S.rsvps.find(r => r.id === id) || { status: 'yes', guests: 0, note: '' };
  const data = { eventId: evId, uid, status: cur.status, guests: cur.guests || 0, note: cur.note || '', ...patch, updatedAt: Date.now(), by: S.user.uid };
  if (data.status === 'no') data.guests = 0;
  if (isRosterUid(uid)) { const v = S.invites.find(x => 'p' + x.id === uid); data.name = (v && (v.name || fmtPhone(v.id))) || cur.name || ''; }
  try { await be.set('rsvps/' + id, data); } catch (e) { toast(friendlyError(e), true); }
}

function icsFor(e) {
  const x = s => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');
  const dt = (d, t) => d.replace(/-/g, '') + (t ? 'T' + t.replace(':', '') + '00' : '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  let start, end;
  if (e.start) {
    start = 'DTSTART:' + dt(e.date, e.start);
    let endT = e.end;
    if (!endT || endT <= e.start) { const [h, m] = e.start.split(':').map(Number); endT = pad2(Math.min(h + 2, 23)) + ':' + pad2(m); }
    end = 'DTEND:' + dt(e.date, endT);
  } else {
    const n = parseDate(e.date); n.setDate(n.getDate() + 1);
    start = 'DTSTART;VALUE=DATE:' + dt(e.date);
    end = 'DTEND;VALUE=DATE:' + n.getFullYear() + pad2(n.getMonth() + 1) + pad2(n.getDate());
  }
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', "PRODID:-//Cal's Dads//Events//EN", 'BEGIN:VEVENT', 'UID:' + e.id + '@calsdads', 'DTSTAMP:' + stamp, start, end,
    'SUMMARY:' + x(e.title), e.location ? 'LOCATION:' + x(e.location) : '', 'DESCRIPTION:' + x((e.details ? e.details + '\n\n' : '') + eventLink(e.id)),
    'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');
}

function setPath(obj, path, val) {

}

async function saveProfile() {
  const f = S.form, uid = S.user.uid, err = $('#pf-err');
  f.first = f.first.trim(); f.last = f.last.trim();
  if (!f.first || !f.last) { err.textContent = 'Please add your first and last name.'; return; }
  const named = f.kids.filter(k => k.name.trim());
  if (!named.length) { err.textContent = 'Please add at least your child’s name.'; return; }
  f.saving = true; render(true);
  const now = Date.now(), ops = [];
  const kids = named.map(k => {
    const photos = { treatment: 0, remission: 0, ...(k.photos || {}) };
    KINDS.forEach(kind => {
      const e = f.edits[k.id + '_' + kind], path = 'photos/' + photoId(uid, k.id, kind);
      if (e === null && photos[kind]) { ops.push({ path }); photos[kind] = 0; }
      else if (e) { ops.push({ path, data: { owner: uid, data: e.data, updatedAt: now } }); photos[kind] = now; }
    });
    return { id: k.id, name: k.name.trim(), diagnosis: k.diagnosis.trim(), status: k.status, wingsDate: k.status === 'wings' ? k.wingsDate || '' : '', photos };
  });
  const keep = new Set(kids.map(k => k.id));
  ((S.me && S.me.kids) || []).forEach(k => { if (!keep.has(k.id)) KINDS.forEach(kind => { if (k.photos && k.photos[kind]) ops.push({ path: 'photos/' + photoId(uid, k.id, kind) }); }); });
  ops.push({ path: 'contacts/' + uid, data: { email: f.email.trim(), phone: f.phone.trim(), share: !!f.share, updatedAt: now } });
  ops.push({ path: 'members/' + uid, data: { first: f.first, last: f.last, kids, approved: S.me ? !!S.me.approved : S.admin, createdAt: S.me ? S.me.createdAt || now : now, updatedAt: now } });
  try {
    await be.batch(ops);
    const wasJoin = f.join;
    S.form = null;
    toast(wasJoin ? 'Welcome aboard!' : 'Saved');
    if (!wasJoin) window.scrollTo(0, 0);
    render(true);
  } catch (e) {
    f.saving = false; render(true);
    $('#pf-err').textContent = friendlyError(e);
  }
}

async function removeFamily(uid) {
  const m = S.members.find(x => x.id === uid) || (uid === S.user.uid ? S.me : null);
  const ops = [];
  ((m && m.kids) || []).forEach(k => KINDS.forEach(kind => { if (k.photos && k.photos[kind]) ops.push({ path: 'photos/' + photoId(uid, k.id, kind) }); }));

  ops.push({ path: 'contacts/' + uid }, { path: 'members/' + uid });
  await be.batch(ops);
}

// Everyone the organizer expects to hear from: approved dads, plus people on the WhatsApp roster
// who haven't joined the site (matched by phone). Roster people carry the RSVP id "p<digits>".
function people() {
  const approved = S.members.filter(m => m.approved);
  const joined = new Set();
  const list = approved.map(m => {
    const c = S.contacts[m.id] || {}, k = phoneKey(c.phone);
    if (k) joined.add(k);
    return { id: m.id, alt: k ? 'p' + k : '', name: fullName(m), m, c };
  });
  S.invites.forEach(v => { if (!joined.has(v.id)) list.push({ id: 'p' + v.id, name: v.name || fmtPhone(v.id), inv: v, c: { phone: fmtPhone(v.id) } }); });
  return list.sort((a, b) => a.name.localeCompare(b.name));
}
function rosterGroups(e) {
  const byUid = Object.fromEntries(S.rsvps.filter(r => r.eventId === e.id).map(r => [r.uid, r]));

  people().forEach(p => { const r = byUid[p.id] || (p.alt && byUid[p.alt]); g[r ? r.status : 'none'].push({ ...p, r }); });

}

function parseRoster(text) {
  const out = [];
  let lastName = '';
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.replace(/[~\u200e\u200f\u202a-\u202e]/g, '').trim();
    if (!line) return;
    const m = line.match(/\+?\d[\d\s().-]{8,}\d/);
    if (!m) { if (!lastName) lastName = line.replace(/\s+Admin$/i, ''); return; }
    const key = phoneKey(m[0]);
    const name = line.replace(m[0], '').replace(/^[\s,;:–—-]+|[\s,;:–—-]+$/g, '').trim();
    if (key) out.push({ key, name: (name || lastName).slice(0, 80) });
    lastName = '';
  });
  return out;
}

function mailtoFor(people, e, kind) {
  const emails = people.map(p => p.c.email).filter(Boolean).join(',');

}

async function saveEvent(form) {
  const d = Object.fromEntries(new FormData(form));
  const err = $('#ev-err');
  if (!d.title.trim() || !d.date) { err.textContent = 'Please add a title and a date.'; return; }
  if (d.start && d.end && d.end <= d.start) { err.textContent = 'The end time is before the start time.'; return; }
  const id = d.eventId || newId(), now = Date.now();
  const prev = S.events.find(e => e.id === id);
  const data = { title: d.title.trim(), date: d.date, start: d.start || '', end: d.end || '', location: d.location.trim(), details: d.details.trim(), rsvpBy: d.rsvpBy || '', allowGuests: !!d.allowGuests, createdAt: prev ? prev.createdAt : now, updatedAt: now };
  try {
    await be.set('events/' + id, data);
    closeModal();
    toast(prev ? 'Event updated' : 'Event posted — copy the link to share it');
    if (!prev) { S.openRoster[id] = true; S.focusEvent = id; setTimeout(focusEventIfNeeded, 200); }
  } catch (e) { err.textContent = friendlyError(e); }
}

document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#modal').innerHTML) closeModal(); });

/* ---------------------------------------------------------------- events */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a, evId = el.dataset.ev;
  const event = evId && S.events.find(e => e.id === evId);
  switch (a) {
    case 'modal-bg': if (ev.target === el) closeModal(); return;
    case 'modal-close': return closeModal();
    case 'reload': return location.reload();
    case 'signout': S.form = null; location.hash = '#events'; return be.signOut();
    case 'demo-in': return be.demoSignIn(el.dataset.k);
    case 'demo-switch': S.form = null; return be.signOut();
    case 'demo-reset': if (confirm('Reset the demo back to its sample data?')) be.resetDemo(); return;
    case 'google':
      try { await be.google(); } catch (e) { if (!/popup-closed|cancelled-popup/.test(e.code || '')) toast(friendlyError(e), true); }
      return;
    case 'auth-mode': S.authMode = S.authMode === 'signup' ? 'signin' : 'signup'; return render(true);
    case 'auth-reset': {
      const email = $('#auth-email').value.trim();
      if (!email) { $('#auth-err').textContent = 'Type your email above first, then tap “Forgot password?”.'; return; }
      try { await be.reset(email); toast('Check your email for a reset link'); } catch (e) { $('#auth-err').textContent = friendlyError(e); }
      return;
    }
    case 'verify-send': try { await be.resendVerify(); toast('Verification email sent'); } catch (e) { toast(friendlyError(e), true); } return;
    case 'verify-check': {
      const u = await be.refreshUser();
      if (!u.verified) return toast('Not verified yet — open the link in the email first.', true);
      return startUser(u);
    }
    case 'rsvp': {
      const mine = S.rsvps.find(r => r.id === evId + '_' + S.user.uid);
      if (mine && mine.status === el.dataset.s) return;
      await setRsvp(evId, { status: el.dataset.s });
      toast(el.dataset.s === 'yes' ? 'See you there!' : el.dataset.s === 'maybe' ? 'Marked as maybe' : 'Thanks for letting us know');
      return;
    }
    case 'guests': {
      const mine = S.rsvps.find(r => r.id === evId + '_' + S.user.uid);
      const n = Math.max(0, Math.min(20, ((mine && mine.guests) || 0) + Number(el.dataset.d)));
      return setRsvp(evId, { guests: n });
    }
    case 'ics': return download((event.title.replace(/[^\w\- ]+/g, '').trim() || 'event') + '.ics', icsFor(event), 'text/calendar');
    case 'copy-invite': return copyText(shareText(event).replace(/\*/g, ''), 'Invite text copied');
    case 'copy-link': return copyText(eventLink(evId), 'Event link copied');
    case 'open-roster': S.openRoster[evId] = true; setTimeout(() => { const r = document.getElementById('roster-' + evId); if (r) r.scrollIntoView({ behavior: 'smooth' }); }, 80); return;
    case 'event-new': return eventModal(null);
    case 'event-edit': return eventModal(event);
    case 'event-del': {
      const e = S.events.find(x => x.id === evId);
      if (!confirm(`Delete “${e.title}” and all its RSVPs? This can’t be undone.`)) return;
      try { await be.batch([...S.rsvps.filter(r => r.eventId === evId).map(r => ({ path: 'rsvps/' + r.id })), { path: 'events/' + evId }]); closeModal(); toast('Event deleted'); } catch (err) { toast(friendlyError(err), true); }
      return;
    }
    case 'roster-toggle': S.openRoster[evId] = !S.openRoster[evId]; return render(true);
    case 'roster-csv': {
      const g = rosterGroups(event);
      const rows = [['RSVP', 'Name', 'On site', 'Guests', 'Phone', 'Email', 'Note', 'Kids']];
      [['yes', 'Going'], ['maybe', 'Maybe'], ['no', "Can't make it"], ['none', 'No reply']].forEach(([k, label]) => g[k].forEach(({ m, r, c, name }) => rows.push([label, name, m ? 'yes' : 'no', (r && r.guests) || '', c.phone || '', c.email || '', (r && r.note) || '', ((m && m.kids) || []).map(x => x.name).join('; ')])));
      return download(`${event.date} ${event.title.replace(/[^\w\- ]+/g, '')}.csv`, toCsv(rows), 'text/csv');
    }
    case 'copy-phones': {
      const g = rosterGroups(event);
      const phones = g[el.dataset.set].map(x => x.c.phone).filter(Boolean);
      if (!phones.length) return toast('No phone numbers on file for them', true);
      return copyText(phones.join(', '), plural(phones.length, 'number') + ' copied');
    }
    case 'copy-emails': {
      const emails = S.members.filter(m => m.approved).map(m => (S.contacts[m.id] || {}).email).filter(Boolean);
      return copyText(emails.join(', '), plural(emails.length, 'email') + ' copied');
    }
    case 'dir-csv': {
      const rows = [['First', 'Last', 'Phone', 'Email', 'Shares contact', 'Kids']];
      S.members.filter(m => m.approved).forEach(m => { const c = S.contacts[m.id] || {}; rows.push([m.first, m.last, c.phone || '', c.email || '', c.share ? 'yes' : 'no', (m.kids || []).map(k => [k.name, k.diagnosis, STATUS[k.status] + (k.wingsDate ? ' ' + k.wingsDate : '')].filter(Boolean).join(' – ')).join('; ')]); });
      return download("Cal's Dads directory.csv", toCsv(rows), 'text/csv');
    }
    case 'approve': {

      const m = S.members.find(x => x.id === el.dataset.u), k = phoneKey((S.contacts[m.id] || {}).phone);
      const ops = [{ path: 'members/' + m.id, data: { ...withoutId(m), approved: true, updatedAt: Date.now() } }];
      if (k) S.rsvps.filter(r => r.uid === 'p' + k).forEach(r => {
        if (!S.rsvps.some(x => x.id === r.eventId + '_' + m.id)) { const d = withoutId(r); delete d.name; ops.push({ path: 'rsvps/' + r.eventId + '_' + m.id, data: { ...d, uid: m.id } }); }
        ops.push({ path: 'rsvps/' + r.id });
      });
      try { await be.batch(ops); toast(m.first + ' approved'); } catch (e) { toast(friendlyError(e), true); }
      return;
    }
    case 'invite-rm': {
      const v = S.invites.find(x => x.id === el.dataset.id);
      if (!confirm(`Remove ${v.name || fmtPhone(v.id)} from the roster?`)) return;
      try { await be.batch([...S.rsvps.filter(r => r.uid === 'p' + v.id).map(r => ({ path: 'rsvps/' + r.id })), { path: 'invites/' + v.id }]); } catch (e) { toast(friendlyError(e), true); }
      return;
    }
    case 'decline': {
      const m = S.members.find(x => x.id === el.dataset.u);
      if (!confirm(`Remove ${fullName(m)} and their family’s info from Cal’s Dads?`)) return;
      try { await removeFamily(m.id); toast(fullName(m) + ' removed'); } catch (e) { toast(friendlyError(e), true); }
      return;
    }
    case 'leave':
      if (!confirm('Remove your family’s info, photos and RSVPs from Cal’s Dads? You can always join again later.')) return;
      try { S.form = null; await removeFamily(S.user.uid); toast('Your info has been removed'); } catch (e) { toast(friendlyError(e), true); }
      return;
    case 'kid-add': S.form.kids.push(blankKid()); S.form.dirty = true; return render(true);
    case 'kid-rm': {
      const k = S.form.kids[Number(el.dataset.i)];
      if (k.name && !confirm(`Remove ${k.name} from your profile?`)) return;
      S.form.kids.splice(Number(el.dataset.i), 1); S.form.dirty = true; return render(true);
    }
    case 'photo-rm': S.form.edits[el.dataset.k] = null; S.form.dirty = true; return render(true);
    case 'form-reset': S.form = null; return render(true);
    case 'zoom': {
      if (!el.src) return;
      ev.preventDefault();
      return openModal(`<div class="card pad"><img src="${el.src}" alt="${esc(el.alt)}"><div class="row" style="justify-content:space-between"><span class="small muted">${esc(el.dataset.cap || '')}</span><button class="btn sm" data-a="modal-close">Close</button></div></div>`, 'photo');
    }
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.f && S.form) {
    setPath(S.form, t.dataset.f, t.type === 'checkbox' ? t.checked : t.value);
    S.form.dirty = true;
    if (t.type === 'radio') render(true);
  } else if (t.hasAttribute('data-a-search')) {
    S.search = t.value; render(true);
  }
});

document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.dataset.note) {
    const mine = S.rsvps.find(r => r.id === t.dataset.note + '_' + S.user.uid);
    if (mine && (mine.note || '') !== t.value.trim()) { await setRsvp(t.dataset.note, { note: t.value.trim() }); toast('Note saved'); }
  } else if (t.dataset.mark) {
    const [evId, uid] = t.dataset.mark.split(':');
    try {
      if (!t.value) await be.del('rsvps/' + evId + '_' + uid);
      else await setRsvp(evId, { status: t.value }, uid);
      t.blur(); toast('RSVP updated');
    } catch (e) { toast(friendlyError(e), true); }
  } else if (t.dataset.photo && t.files && t.files[0]) {
    const key = t.dataset.photo, file = t.files[0];
    try {
      toast('Preparing photo…');
      const data = await compressImage(file);
      const url = URL.createObjectURL(await (await fetch(data)).blob());
      S.form.edits[key] = { data, url }; S.form.dirty = true;
      render(true); toast('Photo added — remember to save');
    } catch (e) { toast(e.message, true); }
  }
});

document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === 'f-profile') return saveProfile();
  if (f.id === 'f-event') return saveEvent(f);
  if (f.id === 'f-roster') {
    const found = parseRoster(f.list.value), known = new Set(S.invites.map(v => v.id)), now = Date.now();
    const fresh = found.filter((x, i) => !known.has(x.key) && found.findIndex(y => y.key === x.key) === i);
    if (!found.length) return toast('No phone numbers found in that text', true);
    try {
      await be.batch(fresh.map(x => ({ path: 'invites/' + x.key, data: { name: x.name, phone: fmtPhone(x.key), addedAt: now } })));
      toast(`Added ${fresh.length} ${fresh.length === 1 ? 'person' : 'people'}` + (found.length > fresh.length ? ` (${found.length - fresh.length} already on the roster)` : ''));
      f.reset();
    } catch (e) { toast(friendlyError(e), true); }
    return;
  }
  if (f.id === 'f-auth') {
    const email = f.email.value.trim(), pw = f.password.value, err = $('#auth-err');
    if (!email || !pw) { err.textContent = 'Please enter your email and a password.'; return; }
    err.textContent = '';
    try { if (S.authMode === 'signup') await be.signUp(email, pw); else await be.signIn(email, pw); }
    catch (e) { err.textContent = friendlyError(e); }
  }
});
</script>
</body>
</html>
